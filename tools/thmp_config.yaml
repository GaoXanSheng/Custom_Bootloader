# ============================================================================
# THMP 表运行时内存补丁配置
# ============================================================================
#
# 本文件定义引导器在 DSDT AML 中对 THMP（Thermal Management Profile）表
# 执行的字节级搜索替换规则。
#
# 使用方法：
#   1. 编辑本文件中的 rules 列表
#   2. 重新构建：build.bat（或 cmake --build build\cmake --config Release）
#   3. 将 build\BOOTX64.efi 部署到 ESP 分区
#
# ============================================================================
# THMP 表结构参考（OEM 原始值）
# ============================================================================
#
# 每个 profile 包含 9 对 (command_id, value_milliwatts)：
#
#   命令 ID  | 含义                              | 单位
#   ---------|-----------------------------------|------
#   cmd 0x05 | SPL  - 持续功耗限制 (CPU)          | 毫瓦
#   cmd 0x07 | sPPT - 慢速包功耗跟踪              | 毫瓦
#   cmd 0x13 | SPL2 - 第二 SPL 限制               | 毫瓦
#   cmd 0x06 | FPPT - 快速包功耗跟踪              | 毫瓦
#   cmd 0x0C | 组合预算 - CPU+GPU 总功耗上限       | 毫瓦
#   cmd 0x0B | （保留功耗参数）                    | 毫瓦
#   cmd 0x01 | （标志/阈值参数）                   | 原始值
#   cmd 0x08 | （保留参数）                        | 原始值
#   cmd 0x03 | （保留参数）                        | 原始值
#
# --------------------------------------------------------------------------
# AC Profiles（交流电源，共 9 个，索引 0/1/2/6/7/8/12/13/14）
# --------------------------------------------------------------------------
#
#   [ 0] SPL=101W, sPPT=105W, FPPT=120W, cmd0C=160W  (性能模式 - 极速)
#   [ 1] SPL= 55W, sPPT= 55W, FPPT= 75W, cmd0C=160W  (性能模式 - Dynamic Boost)
#   [ 2] SPL= 55W, sPPT= 65W, FPPT= 75W, cmd0C=160W  (性能模式 - 变体)
#   [ 6] SPL= 76W, sPPT= 76W, FPPT=120W, cmd0C=160W  (均衡模式 - 极速)
#   [ 7] SPL= 45W, sPPT= 45W, FPPT= 65W, cmd0C=160W  (均衡模式 - DB)
#   [ 8] SPL= 45W, sPPT= 45W, FPPT= 65W, cmd0C=160W  (均衡模式 - 变体)
#   [12] SPL=101W, sPPT=105W, FPPT=120W, cmd0C=160W  (自定义模式 - 极速)
#   [13] SPL= 55W, sPPT= 55W, FPPT= 75W, cmd0C=160W  (自定义模式 - DB)
#   [14] SPL= 55W, sPPT= 55W, FPPT= 75W, cmd0C=160W  (自定义模式 - 变体)
#
# --------------------------------------------------------------------------
# DC Profiles（电池，共 9 个，索引 3/4/5/9/10/11/15/16/17）
# --------------------------------------------------------------------------
#
#   [ 3] SPL= 35W, sPPT= 35W, FPPT= 42W, cmd0C= 90W
#   [ 4] SPL= 45W, sPPT= 45W, FPPT= 55W, cmd0C=120W
#   [ 5] SPL= 35W, sPPT= 35W, FPPT= 42W, cmd0C= 90W
#   [ 9] SPL= 35W, sPPT= 35W, FPPT= 42W, cmd0C= 90W
#   [10] SPL= 45W, sPPT= 55W, FPPT= 55W, cmd0C=120W
#   [11] SPL= 35W, sPPT= 35W, FPPT= 42W, cmd0C= 90W
#   [15] SPL= 35W, sPPT= 35W, FPPT= 42W, cmd0C= 90W
#   [16] SPL= 45W, sPPT= 45W, FPPT= 55W, cmd0C=120W
#   [17] SPL= 35W, sPPT= 35W, FPPT= 42W, cmd0C= 90W
#
# --------------------------------------------------------------------------
# Office Profiles（安静模式 / 办公模式，索引 18-22）
# --------------------------------------------------------------------------
#
#   [18] SPL= 30W, sPPT= 30W, FPPT= 35W, cmd0C= 900W
#   [19] SPL= 85W, sPPT= 90W, FPPT=120W, cmd0C=1600W  ← OEM 已用禁用哨兵
#   [20] SPL= 55W, sPPT= 55W, FPPT= 75W, cmd0C=1600W
#   [21] SPL= 60W, sPPT= 65W, FPPT=120W, cmd0C=1600W
#   [22] SPL= 45W, sPPT= 45W, FPPT= 65W, cmd0C=1600W
#
# ============================================================================
# 值编码说明
# ============================================================================
#
# 值在 AML 中以 DWordConst 编码（5 字节：0x0C 前缀 + 4 字节小端序）。
# 搜索替换的是这 5 字节，大小不变，不影响 AML 流长度。
#
# 常用值速查表：
#   毫瓦值        十六进制      瓦数
#   35000        0x000088B8     35W
#   45000        0x0000AFC8     45W
#   55000        0x0000D6D8     55W
#   65000        0x0000FDE8     65W
#   75000        0x000124F8     75W
#   85000        0x00014C08     85W
#   90000        0x00015F90     90W
#  101000        0x00018A88    101W
#  105000        0x00019A28    105W
#  108000        0x0001A5E0    108W
#  120000        0x0001D4C0    120W
#  160000        0x00027100    160W  ← AC profile cmd0C 原始值
#  900000        0x000DBBA0    900W
# 1600000        0x00186A00   1600W  ← OEM 禁用哨兵（SMU 忽略此上限）
#
# ============================================================================


# THMP 定位标记（在 DSDT AML 中搜索的 ASCII 字符串）
anchor: "THMP"

# 搜索窗口大小（从锚点起始的字节数）
# THMP 数据区实际约 2700 字节，3072 留有余量
search_window: 3072


# ============================================================================
# 补丁规则列表
# ============================================================================
# 每条规则在 THMP 数据区域内搜索 old_value 并替换为 new_value。
#
# 字段说明：
#   name:           规则名称（出现在 unlock.log 中，便于诊断）
#   description:    规则说明（仅供参考，不影响运行）
#   old_value:      要搜索的原始值（十六进制毫瓦数）
#   new_value:      替换为的目标值（十六进制毫瓦数）
#   expected_count: 期望命中次数（0 = 不检查；不匹配时 ALARM 告警）
#   enabled:        是否启用（false = 跳过此规则）
# ============================================================================

rules:

  # --------------------------------------------------------------------------
  # 规则 1：cmd0C 组合预算解锁（AC profiles）
  # --------------------------------------------------------------------------
  # 把 9 个 AC profile 的 CPU+GPU 组合预算上限从 160W 改为 1600W（OEM 禁用
  # 哨兵值）。SMU 收到此哨兵后不再强制总功耗上限，CPU 和 GPU 各自仅受
  # SPL/FPPT/TGP 等独立限制约束。
  #
  # 实测记录：
  # - 260W 中间值无效（SMU 不尊重，CPU 仍被钳制到 40W）
  # - 0x186A00 是 OEM 在 office profile[19] 原厂使用的禁用值
  # - 物理上限仍由 SPL(110W) + GPU TGP(140W) + 280W 适配器约束
  # --------------------------------------------------------------------------
  - name: "cmd0C_budget_unlock"
    description: "组合预算 cmd0C 160W→1600W：解除 SMU 对 CPU+GPU 总功耗的强制上限"
    old_value: 0x00027100    # 160,000 mW = 160W
    new_value: 0x00186A00    # 1,600,000 mW = 1600W（OEM 禁用哨兵）
    expected_count: 9        # 9 个 AC profile（索引 0/1/2/6/7/8/12/13/14）
    enabled: true

  # --------------------------------------------------------------------------
  # 示例：如果你想同时修改 AC profile 的 SPL 值，可以添加类似规则。
  # 注意：不同 profile 可能有不同的 SPL 值，需要分别添加规则。
  # --------------------------------------------------------------------------
  # - name: "spl_101w_to_120w"
  #   description: "把 profile 0/12 的 SPL 从 101W 提升到 120W"
  #   old_value: 0x00018A88    # 101,000 mW = 101W（仅出现在 profile 0 和 12）
  #   new_value: 0x0001D4C0    # 120,000 mW = 120W
  #   expected_count: 2        # profile 0 和 12 各 1 次 = 2
  #   enabled: false

  # - name: "sppt_105w_to_120w"
  #   description: "把 profile 0/12 的 sPPT 从 105W 提升到 120W"
  #   old_value: 0x00019A28    # 105,000 mW = 105W
  #   new_value: 0x0001D4C0    # 120,000 mW = 120W
  #   expected_count: 2
  #   enabled: false
